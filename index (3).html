function level(x=s.xp){return x<=100?'Agente novato':x<=250?'Agente investigador':x<=500?'Agente del cambio':x<=800?'Agente de esperanza':'Transformador del mundo';}
function ending(x=s.impact){return x<40?['🌑','Comunidad indiferente','Muchas decisiones fueron ignoradas. Toda transformación comienza cuando alguien decide actuar.']:x<80?['🌤️','Comunidad en cambio','Tus decisiones comenzaron a transformar Ciudad Nova. Todavía existen desafíos.']:['🌟','Comunidad transformadora','Tus decisiones ayudaron a construir una comunidad donde la dignidad, la solidaridad y el respeto pueden crecer.'];}
function mstate(id=s.activeMission){return s.missions[id]||=( {phase:0,clues:[],talks:[],analysis:{},analysisDone:false,mini:{step:0,done:false,feedback:'',words:[]},decision:null,light:null,boss:[],done:false,eventId:Math.floor(Math.random()*EVENTS.length)});}
function mission(){return MISSIONS[s.activeMission-1];}
function delta(stats){return Object.entries(stats).map(([k,v])=>`<span class="delta">${v>0?'+':''}${v} ${STAT_NAMES[k]}</span>`).join('');}
function award(xp,stats={},impact=0){s.xp+=xp;Object.entries(stats).forEach(([k,v])=>s.stats[k]=clamp(s.stats[k]+v));s.impact=clamp(s.impact+impact);save();}
function log(scope,text,consequence,stats,impact){s.decisions.push({scope,text,consequence,stats,impact});}
function statPanel(){return `<div class="stats">${Object.entries(STAT_NAMES).map(([k,v])=>`<div class="stat"><label>${v} <b>${s.stats[k]}</b></label><div class="bar" role="progressbar" aria-label="${v}" aria-valuenow="${s.stats[k]}" aria-valuemin="0" aria-valuemax="100"><i style="width:${s.stats[k]}%"></i></div></div>`).join('')}</div>`;}
function agentCard(){return `<div class="agent-card"><span class="portrait">${s.avatar}</span><div><strong>${esc(s.name)}</strong><div class="eyebrow">${level()}</div><span class="muted">${s.xp} XP · ${s.badges.length}/5 insignias</span></div></div>`;}
function showModal(html){const d=document.getElementById('modal');d.innerHTML=html+`<div class="actions">${btn('Cerrar','close','quiet')}</div>`;d.showModal();}
function navigate(to){view=to;save();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const nav=btn('Inicio','home','quiet')+(s.name?btn('Mapa','map','quiet'):'')+btn('Insignias','badges','quiet')+btn('Modo docente','teacher','quiet')+btn('✎ Editar historias','editor','quiet')+btn(s.sound?'♪ Sonido: sí':'♪ Sonido: no','sound','quiet',false,`aria-pressed="${s.sound}"`);document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand"><span class="brand-mark">✦</span>A.G.E.N.T.E.<span class="connection"><span class="dot"></span>CIUDAD NOVA</span></div><nav class="topnav" aria-label="Navegación principal">${nav}</nav></header><main id="main" class="shell" tabindex="-1">${storageWarning?`<p class="feedback" role="alert">${esc(storageWarning)}</p>`:''}${screen()}<footer class="footer"><span>Educación Religiosa Católica · 4.º de secundaria</span><span>${s.name?'Progreso guardado en este navegador · ':''}${btn('Cómo jugar','help','quiet')} ${btn('Créditos','credits','quiet')}</span></footer></main>`;}
function screen(){switch(view){case'editor':return editorScreen();case'create':return createScreen();case'map':return mapScreen();case'mission':return missionScreen();case'badges':return badgesScreen();case'teacher':return teacherScreen();case'final':return finalScreen();case'result':return resultScreen();default:return homeScreen();}}
function homeScreen(){return `<section class="hero"><div class="hero-copy"><p class="eyebrow">Una ciudad. Cinco amenazas. Tus decisiones.</p><h1>MISIÓN:<br><span>TRANSFORMAR</span><br>EL MUNDO</h1><p>Tus decisiones pueden cambiar una comunidad.</p><div class="hero-actions">${btn('Iniciar misión ↗','new','primary')}${btn('Continuar →','continue','quiet',!s.name)}</div><span class="tag">Aventura narrativa · Investiga, decide y actúa</span></div><div class="hero-caption"><strong>CIUDAD NOVA</strong>Centro de operaciones · A.G.E.N.T.E.</div></section><div class="mission-strip">${MISSIONS.map((m,i)=>`<div class="strip-item"><span>${esc(m.icon)}</span><div><small>SECTOR 0${i+1}</small>${esc(m.title)}</div></div>`).join('')}</div>`;}
function createScreen(){return `<div class="narrow"><p class="eyebrow">Reclutamiento / 01</p><h2>La próxima decisión<br>empieza contigo.</h2><section class="panel"><p>«Agente, Ciudad Nova necesita tu ayuda. Nuestra tecnología ha detectado cinco zonas donde la convivencia está siendo amenazada. Tu misión será investigar, decidir y actuar. Cada decisión tendrá consecuencias».</p><form id="create-form"><label for="agent-name">Nombre del agente o alias</label><input id="agent-name" name="name" maxlength="32" required placeholder="Elige tu nombre de misión" autocomplete="off"><p class="muted">Puedes usar un alias; no necesitas escribir tu nombre completo.</p><label>Elige tu avatar</label><div class="avatar-grid">${AVATARS.map((a,i)=>btn(a,`avatar:${i}`,a===selectedAvatar?'selected':'',false,`aria-label="Avatar ${i+1}" aria-pressed="${a===selectedAvatar}"`)).join('')}</div><button class="primary" type="submit">Aceptar misión ↗</button></form></section></div>`;}
function mapScreen(){if(!s.name)return homeScreen();return `<div class="row wrap" style="margin-bottom:26px"><div><p class="eyebrow">Centro de operaciones</p><h2 style="margin-bottom:0">Mapa del Colegio San Pío X</h2></div><div class="stack">${agentCard()}${btn('✎ Editar los 5 sectores','editor','quiet')}</div></div><div class="dashboard"><div class="stack"><section class="map" aria-label="Cinco sectores del Colegio San Pío X"><div class="map-grid"></div><span class="map-label">● COLEGIO SAN PÍO X</span>${MISSIONS.map((m,i)=>{let done=s.completed.includes(m.id),locked=i>0&&!s.completed.includes(i);return btn(`<span>${done?'✓ COMPLETADA':locked?'🔒 BLOQUEADA':'● MISIÓN DISPONIBLE'}</span><b>${esc(m.icon)} ${esc(m.title)}</b>`,`zone:${m.id}`,'zone',locked);}).join('')}</section><section class="panel">${statPanel()}</section></div><aside class="sidebar stack"><section class="panel"><p class="eyebrow">Impacto positivo</p><div class="big-number">${s.impact}<span style="font-size:1.3rem">%</span></div><p class="muted">Cada acción deja una huella.</p><div class="bar"><i style="width:${s.impact}%"></i></div><div class="mini-line"><strong>${s.completed.length} de 5 zonas</strong><p class="muted" style="margin-bottom:0">${s.completed.length===5?'La operación final está lista.':'Investiga para desbloquear el siguiente sector.'}</p></div></section><section class="panel"><p class="eyebrow">Operación final</p><h3>Cambio real</h3><p class="muted">Une lo aprendido y crea una campaña para tu comunidad.</p>${btn(s.final.done?'Ver evaluación ↗':'Acceder a la operación ↗',s.final.done?'result':'final','primary',s.badges.length<5)}</section></aside></div>${s.completed.length?`<section class="panel" style="margin-top:24px"><p class="eyebrow">Ecos de tus decisiones</p>${s.completed.map(id=>{const m=MISSIONS[id-1],st=mstate(id);return `<p><strong>${esc(m.icon)} ${esc(m.title)}.</strong> ${esc(m.follow[st.decision>=2?1:0])}</p>`;}).join('')}</section>`:''}`;}
function missionScreen(){const m=mission(),st=mstate();if(st.done)return `<div class="narrow"><p class="eyebrow">Sector 0${m.id} / Completado</p><h2>${esc(m.title)}</h2><section class="panel"><div style="font-size:4rem">🏅</div><h3>${esc(m.badge)}</h3><p>${esc(m.follow[st.decision>=2?1:0])}</p><p class="muted">La misión queda en tu bitácora. Puedes revisar la decisión desde el modo docente.</p>${btn('Volver al mapa →','map','primary')}</section></div>`;return `<div class="row wrap"><div><p class="eyebrow">Sector 0${m.id} · ${esc(m.place)}</p><h2 style="margin-bottom:0">${esc(m.title)}</h2></div><div class="actions"><span class="tag">${esc(m.value)}</span>${btn('✎ Editar sector',`editor:${m.id-1}`,'quiet')}</div></div><div class="stages" aria-label="Etapas de la misión">${PHASES.map((p,i)=>`<span class="${st.phase===i?'active':''}" ${st.phase===i?'aria-current="step"':''}>${i<st.phase?'✓':i+1} ${p}</span>`).join('')}</div>${st.phase>=3&&!s.events[s.activeMission]?`<p>${btn('⚡ Atender alerta pendiente','eventOpen','quiet')}</p>`:''}${phaseScreen(m,st)}`;}
function phaseScreen(m,st){switch(st.phase){case 0:return `<section class="panel scene"><div><p class="eyebrow">Nueva misión detectada</p><p>${esc(m.intro)}</p>${m.id>1?`<p class="muted" style="font-size:1rem">En el sector anterior: ${esc(MISSIONS[m.id-2].follow[mstate(m.id-1).decision>=2?1:0])}</p>`:''}${btn('Investigar →','phase:1','primary')}</div></section>`;case 1:return `<p class="muted">Explora la escena. Cada elemento revela una parte de la historia.</p><div class="clues">${m.clues.map((c,i)=>btn(`<span class="eyebrow">${st.clues.includes(i)?'✓ PISTA ENCONTRADA':'⌕ EXAMINAR'}</span><strong>${esc(c[0])}</strong>`,`clue:${i}`,`clue ${st.clues.includes(i)?'found':''}`)).join('')}</div><div class="actions">${btn(`Entrevistar a los testigos → (${st.clues.length}/4 pistas)`,'phase:2','primary',st.clues.length<4)}</div>`;case 2:return `<div class="npc-tabs">${m.characters.map((c,i)=>btn(`<span>${esc(c.avatar)}</span><div>${esc(c.name)}<small style="display:block">${esc(c.role)}</small></div>`,`npc:${i}`,activeNPC===i?'selected':'')).join('')}</div><div class="grid2"><section class="panel"><p class="eyebrow">Conversación · ${esc(m.characters[activeNPC].name)}</p><h3>Escucha antes de decidir.</h3><div class="stack">${(m.questions||QUESTIONS).map((q,i)=>btn(`${st.talks.includes(activeNPC+'-'+i)?'✓ ':''}${esc(q)}`,`talk:${i}`,'choice')).join('')}</div></section><section class="panel"><p class="eyebrow">Testimonio</p><div class="quote">${esc(st.lastTalk||'«Gracias por venir. ¿Qué te gustaría saber?»')}</div><p class="muted" style="margin-top:18px">Habla al menos una vez con cada personaje. Puedes escuchar todas sus respuestas.</p></section></div><div class="actions">${btn('Conectar las pistas →','phase:3','primary',!m.characters.every((c,i)=>st.talks.some(t=>t.startsWith(i+'-'))))}</div>`;case 3:return analysisScreen(m,st);case 4:return decisionScreen(m,st);case 5:return lightScreen(m,st);case 6:return bossScreen(m,st);}}
function analysisScreen(m,st){if(!st.analysisDone)return `<div class="grid2"><section class="panel"><p class="eyebrow">Tablero de investigación</p><h3>Relaciona lo que encontraste.</h3>${m.clues.map(c=>`<p class="mini-line"><strong>${esc(c[0])}</strong><br><span class="muted">${esc(c[1])}</span></p>`).join('')}</section><section class="panel"><form id="analysis-form"><div class="stack">${['Problema principal','Personas afectadas','Valores vulnerados','Posible solución'].map((label,i)=>`<div><label for="analysis-${i}">${label}</label><select id="analysis-${i}" name="a${i}" required><option value="">Selecciona una conexión…</option>${[0,1,2,3].map(j=>{let idx=(j+i+1)%4;return `<option value="${idx}" ${String(st.analysis[i])===String(idx)?'selected':''}>${esc(m.analysis[idx])}</option>`;}).join('')}</select></div>`).join('')}<button class="primary" type="submit">Comprobar conexiones</button></div></form></section></div>`;return miniScreen(m,st);}
function miniScreen(m,st){const z=st.mini,c=m.miniConfig||miniDefaults(m.mini);if(z.done)return `<div class="narrow panel"><p class="eyebrow">Reto resuelto</p><h2>Ya tienes otra perspectiva.</h2><p>${esc(c.success)}</p><span class="delta">+20 XP</span><div class="actions">${btn('Tomar una decisión →','phase:4','primary')}</div></div>`;let inner=`<h2>${esc(c.title)}</h2><p>${esc(c.instructions)}</p>`;if(m.mini==='words'){const order=c.words.map((_,i)=>i).reverse();inner+=`<div class="word-target" aria-live="polite">${esc(z.words.map(i=>c.words[i]).join(' '))||'<span class="muted">Tu mensaje aparece aquí…</span>'}</div><div class="word-bank">${order.map(i=>btn(esc(c.words[i]),`word:${i}`,'',z.words.includes(i))).join('')}</div><div class="actions">${btn('Deshacer','wordUndo','quiet',!z.words.length)}${btn('Enviar mensaje','wordCheck','primary',z.words.length<c.words.length)}</div>`;}else{const r=c.rounds[z.step];inner+=`<p class="eyebrow">Situación ${z.step+1} de ${c.rounds.length}</p><div class="mini-card ${m.mini==='waste'?'draggable':''}" ${m.mini==='waste'?'draggable="true" id="waste-item"':''}>${esc(r.prompt)}</div>`;const opts=r.options||c.categories,action=m.mini==='posts'?'post':m.mini;inner+=`<div class="${m.mini==='waste'?'bin-grid':'stack'}" style="margin-top:20px">${opts.map((t,i)=>btn(esc(t),`${action}:${i}`,m.mini==='waste'?'bin':'choice',false,m.mini==='waste'?`data-bin="${i}"`:'')).join('')}</div>`;}return `<section class="panel narrow"><p class="eyebrow">Reto de campo / ${m.id}</p>${inner}${z.feedback?`<p class="feedback" role="status">${esc(z.feedback)}</p>`:''}</section>`;}
function decisionScreen(m,st){if(st.decision!==null){const c=m.choices[st.decision];return `<section class="panel narrow consequence"><p class="eyebrow">Decisión tomada</p><h2>Tu acción deja una huella.</h2><p>${esc(c[1])}</p>${delta(c[2])}<p class="muted">${st.decision<2?'Equivocarse también abre una oportunidad: en el siguiente reto podrás practicar cómo reparar el daño.':'Una acción puede iniciar el cambio; el acompañamiento necesita continuidad.'}</p>${btn('Buscar luz para la misión →','phase:5','primary')}</section>`;}return `<section class="panel narrow"><p class="eyebrow">Momento de actuar</p><h2>¿Qué harás ahora?</h2><p>${esc(m.dilemma)}</p><div class="stack">${m.choices.map((c,i)=>btn(`<span class="letter">${'ABCD'[i]}</span><span>${esc(c[0])}</span>`,`decision:${i}`,'choice')).join('')}</div></section>`;}
function lightScreen(m,st){const correct=m.lightCorrect??0;return `<section class="panel narrow"><p class="eyebrow">✝ Luz para la misión</p><h2>${esc(m.bible[0])}</h2><blockquote class="quote">${esc(m.bible[1])}</blockquote><p class="muted">${esc(m.lightNote)}</p><h3>¿Cómo se relaciona este mensaje con tu misión?</h3>${st.light===null?`<div class="stack">${m.light.map((t,i)=>btn(esc(t),`light:${i}`,'choice')).join('')}</div>`:`<p class="feedback">${st.light===correct?'Relacionaste la fe con una acción concreta. +10 XP.':'Esta idea necesita un paso más: '+esc(m.light[correct])+' Puedes seguir y ponerla en práctica.'}</p>${btn('Enfrentar la amenaza →','phase:6','primary')}`}</section>`;}
function bossScreen(m,st){return `<section class="panel"><div class="boss"><div class="boss-symbol" aria-hidden="true">${['◈','◉','⌁','❄','☣'][m.id-1]}</div><div><p class="eyebrow">Amenaza simbólica · sin violencia física</p><h2>${esc(m.boss)}</h2><label>Poder de ${esc(m.problem.toLowerCase())} · ${100-st.boss.length*25}%</label><div class="bar" role="progressbar" aria-label="Poder de la amenaza" aria-valuenow="${100-st.boss.length*25}" aria-valuemin="0" aria-valuemax="100"><i style="width:${100-st.boss.length*25}%"></i></div><p class="muted" style="margin-top:14px">Desactiva esta amenaza con cuatro compromisos. Cada acción reduce su poder un 25%.</p></div></div><div class="clues">${m.bossActions.map((a,i)=>btn(`${st.boss.includes(i)?'✓ ':''}${esc(a)}`,`boss:${i}`,'choice',st.boss.includes(i))).join('')}</div>${st.boss.length===4?`<div class="feedback"><strong>Misión completada.</strong> Las acciones abren una oportunidad de reparación. Tu decisión anterior sigue formando parte de la historia.</div>${btn('Recibir insignia →','complete','primary')}`:''}</section>`;}
function badgesScreen(){return `<p class="eyebrow">Vitrina de agente</p><h2>Cinco formas de transformar.</h2><p class="muted">Cada insignia reconoce una misión completada. El impacto refleja las decisiones tomadas.</p><div class="badge-grid">${MISSIONS.map(m=>`<article class="badge ${s.badges.includes(m.id)?'':'locked'}"><span class="eyebrow">SECTOR 0${m.id}</span><div class="medal">${s.badges.includes(m.id)?'🏅':'🔒'}</div><h3>${esc(m.badge)}</h3><span class="muted">${esc(m.value)}</span></article>`).join('')}</div><div class="actions">${btn(s.name?'Volver al mapa':'Volver al inicio',s.name?'map':'home','primary')}</div>`;}
function teacherScreen(){let vals=Object.keys(STAT_NAMES).sort((a,b)=>s.stats[b]-s.stats[a]),strong=s.xp?STAT_NAMES[vals[0]]:'Sin datos',weak=s.xp?STAT_NAMES[vals[vals.length-1]]:'Sin datos';return `<p class="eyebrow">Modo docente · Esta partida</p><h2>Aprender también es revisar.</h2><p class="muted">Evaluación formativa de este navegador. No califica la fe ni el valor personal del estudiante. Los indicadores orientan el diálogo; no sustituyen una valoración docente.</p>${s.name?`<section class="panel">${agentCard()}<div class="grid2 mini-line"><div><p><strong>Impacto:</strong> ${s.impact}% · ${s.completed.length}/5 misiones</p><p><strong>Valor más desarrollado:</strong> ${strong}</p><p><strong>Por fortalecer:</strong> ${weak}</p></div><div><p><strong>Resultado:</strong> ${s.final.done?ending()[1]:'Aventura en curso'}</p><p><strong>Insignias:</strong> ${s.badges.length}/5</p></div></div>${statPanel()}</section><section class="panel" style="margin-top:24px"><h3>Bitácora de decisiones</h3><div class="teacher-table"><table><thead><tr><th>Situación</th><th>Decisión</th><th>Consecuencia</th><th>Impacto</th></tr></thead><tbody>${s.decisions.map(d=>`<tr><td>${esc(d.scope)}</td><td>${esc(d.text)}</td><td>${esc(d.consequence)}</td><td>${d.impact>0?'+':''}${d.impact}</td></tr>`).join('')||'<tr><td colspan="4">Todavía no hay decisiones registradas.</td></tr>'}</tbody></table></div></section>${s.final.campaign?`<section style="margin-top:24px">${campaignCard(s.final.campaign)}</section>`:''}${s.final.reflections.some(Boolean)?`<section class="panel" style="margin-top:24px"><h3>Mi misión continúa</h3>${REFLECTIONS.map((q,i)=>`<p><strong>${esc(q)}</strong><br>${esc(s.final.reflections[i]||'Sin respuesta')}</p>`).join('')}</section>`:''}<div class="actions">${btn('Descargar informe','report','primary')}${btn('Imprimir informe','print','quiet')}</div>`:'<section class="panel">Inicia una partida para consultar el progreso.</section>'}<section class="panel" style="margin-top:24px"><h3>Guía de interpretación</h3><p>Impacto: decisiones de zona (hasta 50 puntos), eventos sorpresa (hasta 10), operación final (hasta 30) y acciones contra las amenazas (10). Las decisiones perjudiciales pueden restar puntos. El total se limita a 0–100.</p><p>XP: pistas +5; conexiones bien justificadas y respuestas reflexivas +10; minijuego resuelto +20; misión superada +50; zona completada +100. Las insignias reconocen el recorrido, incluso si hubo errores.</p><p class="muted">El panel es accesible sin contraseña y solo muestra esta partida local. Se recomienda conversar sobre las razones de cada decisión y las posibilidades de reparación.</p></section>`;}
function campaignCard(c){return `<article class="campaign"><p class="eyebrow">A.G.E.N.T.E. / Campaña de Ciudad Nova</p><h2>${esc(c.name)}</h2><blockquote>«${esc(c.slogan)}»</blockquote><p>${esc(c.message)}</p><p><strong>Problema:</strong> ${esc(c.problem)}<br><strong>Valor cristiano:</strong> ${esc(c.value)}</p><p><strong>Nuestra acción:</strong> ${esc(c.action)}</p></article>`;}
function finalScreen(){if(s.badges.length<5)return mapScreen();if(s.final.done)return resultScreen();const f=s.final;const visibleStep=f.step<5?f.step+1:f.step===5?6:7;if(f.step===5)return `<p class="eyebrow">Operación: Cambio real · Etapa 6 de 7</p><h2>Tu mensaje puede construir.</h2><div class="grid2"><section class="panel"><p>Crea una campaña que responda al caso de Álex y a las necesidades del patio. Propón una acción posible, sin exponer a ninguna persona.</p><form id="campaign-form" class="stack">${[['name','Nombre de campaña',60],['slogan','Slogan',100],['problem','Problema',120],['message','Mensaje principal',350],['value','Valor cristiano',80],['action','Acción concreta',350]].map(([key,label,max])=>`<div><label for="campaign-${key}">${label}</label><${max>150?'textarea':'input'} id="campaign-${key}" name="${key}" maxlength="${max}" required ${max>150?'':'type="text"'}>${max>150?'</textarea>':''}</div>`).join('')}<button class="primary" type="submit">Crear tarjeta de campaña ↗</button></form></section><aside class="panel"><p class="eyebrow">Antes de publicar</p><h3>Una campaña que se pueda cumplir.</h3><p>¿Qué cambiará con tu acción? ¿Quién puede acompañarte? ¿Cómo cuidarás la privacidad?</p><p class="quote">«Antes de publicar, piensa en la persona».</p><p class="muted">Tu tarjeta se guarda dentro del juego. No se publica en redes.</p></aside></div>`;const index=f.step===6?5:f.step,step=FINAL_STEPS[index],answer=f.answers[index];return `<div class="narrow"><p class="eyebrow">Operación: Cambio real · Etapa ${visibleStep} de 7</p><h2>${step.title}</h2>${f.step===6&&f.campaign?campaignCard(f.campaign):''}<section class="panel" style="margin-top:20px"><p>${step.text}</p>${answer?`<p class="feedback">${answer.good?step.good:step.bad}</p>${btn(f.step===6?'Ver el futuro de Ciudad Nova →':'Continuar operación →','finalNext','primary')}`:`<div class="stack">${step.options.map((t,i)=>btn(t,`finalChoice:${i}`,'choice')).join('')}</div>`}</section></div>`;}
function resultScreen(){if(!s.final.done)return finalScreen();const e=ending(),strong=Object.keys(STAT_NAMES).sort((a,b)=>s.stats[b]-s.stats[a])[0];return `<div class="narrow"><p class="eyebrow">Resultado de la operación</p><h2>${e[0]} ${e[1]}</h2><p>${e[2]}</p><section class="certificate"><p class="eyebrow">A.G.E.N.T.E. · Ciudad Nova</p><h2>Certificado de<br>Agente Transformador</h2><p class="name">${esc(s.name)}</p><p>${level()}</p><div class="stats-summary"><div><strong>${s.xp}</strong><br>XP obtenidos</div><div><strong>${s.badges.length}/5</strong><br>insignias</div><div><strong>${s.impact}%</strong><br>impacto positivo</div></div><p style="margin-top:24px">Valor más desarrollado: <strong>${STAT_NAMES[strong]}</strong></p><p>«Tus decisiones también pueden transformar el mundo real».</p></section><div style="margin-top:24px">${campaignCard(s.final.campaign)}</div><section class="panel" style="margin-top:24px"><p class="eyebrow">Mi misión continúa</p><h3>De Ciudad Nova a tu comunidad.</h3><p class="muted">Escribe sin incluir información privada de otras personas. Las respuestas se guardan al escribir.</p><div class="stack">${REFLECTIONS.map((q,i)=>`<div><label for="reflection-${i}">${esc(q)}</label><textarea id="reflection-${i}" data-reflection="${i}" maxlength="1200">${esc(s.final.reflections[i]||'')}</textarea></div>`).join('')}</div></section><div class="actions">${btn('Imprimir certificado y reflexión','print','primary')}${btn('Descargar informe','report')}${btn('Nueva partida','new','quiet')}</div></div>`;}
function miniComplete(){const st=mstate();if(st.mini.done)return;st.mini.done=true;award(20);toast('Reto resuelto · +20 XP');render();}
function chooseMini(type,i){const st=mstate(),z=st.mini,m=mission(),c=m.miniConfig||miniDefaults(m.mini);if(z.done||st.phase!==3||!st.analysisDone||!c.rounds)return;const correct=i===c.rounds[z.step].correct;z.feedback=correct?c.success:c.retry;if(correct){z.step++;if(z.step===c.rounds.length){miniComplete();return;}}save();render();}
function eventModal(){let st=mstate(),ev=EVENTS[st.eventId];if(s.events[s.activeMission])return;showModal(`<p class="eyebrow">⚡ Alerta inesperada</p><h2>${ev.title}</h2><p>${ev.text}</p><div class="stack">${ev.options.map((o,i)=>btn(o[0],`event:${i}`,'choice')).join('')}</div>`);document.querySelector('#modal [data-action="close"]').textContent='Decidir más tarde';}
function completeMission(){const st=mstate(),m=mission();if(st.done||st.boss.length!==4)return;st.done=true;s.completed.push(m.id);s.badges.push(m.id);award(150,{},2);view='map';save();render();showModal(`<p class="eyebrow">Insignia conseguida</p><div style="font-size:4rem">🏅</div><h2>${esc(m.badge)}</h2><p>+50 XP por superar la misión · +100 XP por completar la zona.</p><p>${m.id===5?'OPERACIÓN: CAMBIO REAL DESBLOQUEADA':'NUEVA ZONA DESBLOQUEADA'}</p><p class="muted">${esc(m.follow[st.decision>=2?1:0])}</p>`);}
function act(action){const [a,v]=action.split(':'),i=Number(v);if(a.startsWith('editor')){editorAction(a,i);return;}beep();switch(a){case'close':document.getElementById('modal').close();return;case'home':navigate('home');return;case'map':navigate(s.name?'map':'home');return;case'badges':navigate('badges');return;case'teacher':navigate('teacher');return;case'help':showModal('<p class="eyebrow">Manual de campo</p><h2>Escucha. Conecta. Actúa.</h2><p>1. Crea tu agente y entra en la primera zona del mapa.</p><p>2. Examina las cuatro pistas y conversa con ambos personajes.</p><p>3. Relaciona las pistas y resuelve un reto. Puedes volver a intentar los minijuegos.</p><p>4. Decide y observa la consecuencia. Los errores no bloquean la aventura.</p><p>5. Reflexiona con un pasaje bíblico y desactiva la amenaza mediante cuatro acciones.</p><p>Reúne cinco insignias para crear tu campaña final. Usa Tab y Enter para jugar con teclado. En el reto de residuos también puedes pulsar un contenedor.</p><p>El progreso se guarda en este navegador. En un equipo compartido, inicia una nueva partida cuando corresponda.</p>');return;case'credits':showModal('<h2>Créditos</h2><p><strong>Misión: Transformar el Mundo</strong><br>Diseño pedagógico basado en el documento proporcionado por el docente. Aplicación y adaptación narrativa: Codex.</p><p>A.G.E.N.T.E.: Agentes Generadores de Esperanza, Nuevas Acciones, Transformación y Empatía.</p><p>Ciudad, personajes, mensajes e imágenes de investigación ficticios. Ilustración de Ciudad Nova generada con IA. Avatares e iconos: emojis del sistema.</p><p>Pasajes bíblicos presentados como paráfrasis educativas. La propuesta conecta fe y vida desde la Educación Religiosa Católica.</p><p>No se envía información a servicios externos. El sonido opcional se genera en el dispositivo.</p>');return;case'sound':s.sound=!s.sound;save();render();beep();return;case'new':if(s.name){showModal(`<h2>¿Comenzar una nueva partida?</h2><p>Se borrará el progreso guardado de ${esc(s.name)} en este navegador. Puedes descargar el informe antes de empezar.</p><div class="actions">${btn('Descargar informe','report')}${btn('Borrar y comenzar','reset','danger')}</div>`);}else{selectedAvatar=AVATARS[0];navigate('create');}return;case'reset':s=initial();syncStory();selectedAvatar=AVATARS[0];document.getElementById('modal').close();navigate('create');return;case'continue':if(s.name){view=s.final.done?'result':s.screen==='mission'?'mission':s.screen==='final'?'final':'map';render();}return;case'avatar':selectedAvatar=AVATARS[i]||AVATARS[0];document.querySelectorAll('.avatar-grid button').forEach((b,j)=>{b.classList.toggle('selected',i===j);b.setAttribute('aria-pressed',String(i===j));});return;case'zone':if(i<1||i>5||(i>1&&!s.completed.includes(i-1)))return;s.activeMission=i;activeNPC=0;mstate(i);navigate('mission');return;case'phase':{const st=mstate();if(i!==st.phase+1)return;if(i===2&&st.clues.length<4)return;if(i===3&&!mission().characters.every((c,j)=>st.talks.some(t=>t.startsWith(j+'-'))))return;if(i===4&&!st.mini.done)return;if(i===5&&st.decision===null)return;if(i===6&&st.light===null)return;st.phase=i;save();render();if(i===3&&!s.events[s.activeMission])eventModal();return;}case'clue':{const st=mstate(),c=mission().clues[i];if(!c||st.phase!==1)return;const fresh=!st.clues.includes(i);if(fresh){st.clues.push(i);award(5);render();toast('Pista encontrada · +5 XP');}showModal(`<p class="eyebrow">${fresh?'Pista encontrada · +5 XP':'Pista archivada'}</p><h2>${esc(c[0])}</h2><p>${esc(c[1])}</p>`);return;}case'npc':activeNPC=i;render();return;case'talk':{const st=mstate(),c=mission().characters[activeNPC];if(st.phase!==2)return;const key=activeNPC+'-'+i;if(!st.talks.includes(key))st.talks.push(key);st.lastTalk=`${c.name}: «${c.answers[i]}»`;save();render();return;}case'signal':case'post':case'radar':case'waste':chooseMini(a,i);return;case'word':{const z=mstate().mini;if(!z.words.includes(i))z.words.push(i);save();render();return;}case'wordUndo':mstate().mini.words.pop();save();render();return;case'wordCheck':{const z=mstate().mini;if(z.words.length===mission().miniConfig.words.length&&z.words.every((n,j)=>n===j)){z.feedback=mission().miniConfig.success;miniComplete();}else{z.feedback=mission().miniConfig.retry;save();render();}return;}case'decision':{const st=mstate(),m=mission(),c=m.choices[i];if(st.decision!==null||st.phase!==4||!c)return;st.decision=i;log(m.title,c[0],c[1],c[2],c[3]);award(0,c[2],c[3]);render();return;}case'light':{const st=mstate();if(st.light!==null||st.phase!==5)return;st.light=i;award(i===(mission().lightCorrect??0)?10:0);render();return;}case'boss':{const st=mstate();if(st.phase!==6||st.boss.includes(i)||i<0||i>3)return;st.boss.push(i);save();render();toast('Acción activada · amenaza −25%');return;}case'complete':completeMission();return;case'event':{const st=mstate();if(s.events[s.activeMission])return;const ev=EVENTS[st.eventId],c=ev.options[i];s.events[s.activeMission]={eventId:st.eventId,choice:i};log('Evento: '+ev.title,c[0],c[1],c[2],c[3]);award(0,c[2],c[3]);document.getElementById('modal').innerHTML=`<p class="eyebrow">Tu decisión cuenta</p><h2>${ev.title}</h2><p>${esc(c[1])}</p>${delta(c[2])}<div class="actions">${btn('Volver a la investigación','close','primary')}</div>`;return;}case'eventOpen':if(view==='mission'&&!mstate().done)eventModal();return;case'final':if(s.badges.length===5)navigate('final');return;case'result':if(s.final.done)navigate('result');return;case'finalChoice':{const f=s.final,idx=f.step===6?5:f.step,step=FINAL_STEPS[idx];if(f.done||f.step===5||f.answers[idx]||!step||s.badges.length<5)return;let good=i===step.best;f.answers[idx]={choice:i,good};log('Operación final: '+step.title,step.options[i],good?step.good:step.bad,good?{criticalThinking:5}:{criticalThinking:-2},good?5:0);award(good?10:0,good?{criticalThinking:5}:{criticalThinking:-2},good?5:0);render();return;}case'finalNext':{const f=s.final,idx=f.step===6?5:f.step;if(!f.answers[idx])return;if(f.step===6){f.done=true;navigate('result');}else{f.step++;save();render();}return;}case'print':window.print();return;case'report':downloadReport();return;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='create-form'){const name=new FormData(e.target).get('name').trim();if(!name){document.getElementById('agent-name').setCustomValidity('Escribe un nombre o alias.');document.getElementById('agent-name').reportValidity();return;}s=initial();s.name=name;s.avatar=selectedAvatar;syncStory();navigate('map');toast('Bienvenido a A.G.E.N.T.E.');}if(e.target.id==='analysis-form'){const st=mstate();if(st.analysisDone)return;let f=new FormData(e.target),correct=0;for(let i=0;i<4;i++){st.analysis[i]=f.get('a'+i);if(Number(st.analysis[i])===i)correct++;}if(correct===4){st.analysisDone=true;award(10);render();toast('Pistas conectadas · +10 XP');}else{save();showModal(`<h2>Revisemos las conexiones.</h2><p>Has conectado ${correct} de 4 elementos. El problema describe el daño; los afectados son quienes lo viven; los valores orientan el trato; la solución propone qué hacer.</p><p>Vuelve al tablero y ajusta las conexiones. No pierdes puntos por intentarlo.</p>`);}}if(e.target.id==='campaign-form'){const f=new FormData(e.target),c=Object.fromEntries(f.entries());if(Object.values(c).some(v=>!v.trim())){toast('Completa cada campo con una idea.');return;}s.final.campaign=Object.fromEntries(Object.entries(c).map(([k,v])=>[k,v.trim()]));s.final.step=6;save();render();}});
document.addEventListener('input',e=>{if(e.target.id==='agent-name')e.target.setCustomValidity('');if(e.target.dataset.reflection!==undefined){s.final.reflections[Number(e.target.dataset.reflection)]=e.target.value;save();}});
document.addEventListener('dragstart',e=>{if(e.target.id==='waste-item')e.dataTransfer.setData('text/plain','nova-waste');});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-bin]'))e.preventDefault();});
document.addEventListener('drop',e=>{const b=e.target.closest('[data-bin]');if(b){e.preventDefault();if(e.dataTransfer.getData('text/plain')==='nova-waste')chooseMini('waste',Number(b.dataset.bin));}});
function downloadReport(){const report={juego:'Misión: Transformar el Mundo',agente:s.name,nivel:level(),xp:s.xp,estadisticas:s.stats,misionesCompletadas:s.completed.map(id=>MISSIONS[id-1].title),insignias:s.badges.map(id=>MISSIONS[id-1].badge),impacto:s.impact,resultado:s.final.done?ending()[1]:'En curso',decisiones:s.decisions,campana:s.final.campaign,reflexiones:REFLECTIONS.map((q,i)=>({pregunta:q,respuesta:s.final.reflections[i]||''}))};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='informe-ciudad-nova.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Informe descargado');}
// Superficie opcional para navegadores con WebMCP; no modifica partidas.
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'consultar_mision',description:'Consulta el avance local de la aventura Ciudad Nova sin cambiar decisiones.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async(input)=>{if(!input||Object.keys(input).length)throw new Error('No se requieren parámetros.');return {agente:s.name,xp:s.xp,impacto:s.impact,zonas:s.completed,etapa:s.missions[s.activeMission]?.phase??0};}})).catch(()=>{});}catch(e){}}
render();


</script></body></html>
